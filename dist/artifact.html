<title>Linuxverse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Linuxverse — "phosphor console": ink-blue surfaces, amber phosphor accent, teal signal.
   Layout: fixed console header + bottom dock, single readable column, panels only where they hold tools. */
:root {
  --bg: #0c1018; --surface: #121927; --surface2: #182134; --line: #243049; --fg: #e7eaf3; --muted: #8d96ad;
  --accent: #ffb347; --accent-ink: #1a1206; --accent2: #45d3c0; --bad: #ff7a7a; --good: #6fe3a1; --warn: #ffd166;
  --term-bg: #070a11; --term-fg: #d9e1ef; --term-dim: #7d879e; --term-line: #1b2336;
  --k-user: #45d3c0; --k-proc: #ffb347; --k-kernel: #a993ff; --k-file: #79aaff; --k-hw: #ff8aa8;
  --l-acc: 68%; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px; --r-sm: 8px;
  --hdr-h: 112px; --bnav-h: 62px; --pl-h: 0px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1f6; --surface: #ffffff; --surface2: #f4f6fa; --line: #d5dbe7; --fg: #141a27; --muted: #586379;
    --accent: #b75e00; --accent-ink: #ffffff; --accent2: #0b8a7a; --bad: #c42b3c; --good: #1c8a4e; --warn: #8a6100;
    --term-bg: #0e1422; --term-fg: #dbe3f0; --term-dim: #8a94aa; --term-line: #232d44;
    --k-user: #0b8a7a; --k-proc: #b75e00; --k-kernel: #6b4fd8; --k-file: #2d6bd4; --k-hw: #c2335a;
    --l-acc: 38%; --shadow: 0 10px 30px rgba(20, 30, 60, .12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1f6; --surface: #ffffff; --surface2: #f4f6fa; --line: #d5dbe7; --fg: #141a27; --muted: #586379;
  --accent: #b75e00; --accent-ink: #ffffff; --accent2: #0b8a7a; --bad: #c42b3c; --good: #1c8a4e; --warn: #8a6100;
  --term-bg: #0e1422; --term-fg: #dbe3f0; --term-dim: #8a94aa; --term-line: #232d44;
  --k-user: #0b8a7a; --k-proc: #b75e00; --k-kernel: #6b4fd8; --k-file: #2d6bd4; --k-hw: #c2335a;
  --l-acc: 38%; --shadow: 0 10px 30px rgba(20, 30, 60, .12);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body);
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: var(--fg); }
code, .mono { font-family: var(--f-mono); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.bad { color: var(--bad); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { width: 20px; height: 20px; flex: none; }
mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ---------- Header (fixed; heights measured in JS) ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 41; background: var(--bg); }
#hdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.hdr-row { display: flex; align-items: center; gap: 8px; max-width: 920px; margin: 0 auto; }
#logo { display: flex; align-items: center; gap: 8px; font: 700 19px/1 var(--f-display); letter-spacing: .02em; margin-right: auto; }
#logo b { font-weight: 700; } #logo span { color: var(--accent); }
.hdr-acts { display: flex; gap: 6px; }
.ibtn {
  display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); transition: transform .15s, background .2s, border-color .2s;
}
.ibtn:hover { border-color: var(--accent); }
.ibtn:active { transform: scale(.94); }
.ibtn.sm { width: 32px; height: 32px; border-radius: 8px; } .ibtn.sm .ic { width: 16px; height: 16px; }
.ibtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ibtn.ok { color: var(--good); border-color: var(--good); }
#btn-help { font: 700 18px var(--f-display); }
#btn-music.on { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
#btn-music.on .ic { animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2px) rotate(-6deg); } }

#q-wrap { position: relative; max-width: 920px; margin: 8px auto 0; }
.search {
  display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 11px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted);
}
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; height: 100%; font-size: 15px; }
.search input::placeholder { color: var(--muted); }
.kbd { font: 12px var(--f-mono); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--muted); }
#results {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); max-height: min(62vh, 520px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; z-index: 5;
}
#results h4 { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 10px 10px 4px; }
.r-item { display: grid; gap: 2px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; min-width: 0; }
.r-item:hover, .r-item:focus-visible { background: var(--surface2); }
.r-item small { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-item code { font-size: 13px; overflow-wrap: anywhere; }
.r-empty { padding: 12px; }

/* ---------- Main + bottom dock ---------- */
#view {
  padding-top: calc(var(--hdr-h) + 14px);
  padding-bottom: calc(var(--bnav-h) + var(--pl-h) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 952px; margin: 0 auto; min-height: 100vh;
}
#bnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
}
#bnav button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; color: var(--muted); border-radius: 10px; position: relative; }
#bnav button.on { color: var(--accent); }
#bnav button.on::before { content: ""; position: absolute; top: -7px; width: 26px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

/* ---------- Buttons, chips, badges ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; padding: 0 16px; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; border: 1px solid var(--accent); transition: transform .15s, filter .2s;
}
.btn:hover { filter: brightness(1.06); } .btn:active { transform: scale(.97); }
.btn .ic { width: 17px; height: 17px; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }
.link { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: 14px; font-weight: 600; }
.link .ic { width: 16px; height: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px;
  border: 1px solid var(--line); background: var(--surface); white-space: nowrap; transition: border-color .2s, background .2s;
}
.chip:hover { border-color: var(--accent2); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.ck input { accent-color: var(--accent); margin: 0; }
.badge { display: inline-block; font: 600 10.5px/1 var(--f-mono); letter-spacing: .04em; padding: 4px 7px; border-radius: 6px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
.badge.b-vis { color: var(--k-kernel); border-color: color-mix(in srgb, var(--k-kernel) 40%, transparent); }
.badge.b-live { color: var(--accent2); border-color: color-mix(in srgb, var(--accent2) 40%, transparent); }
.badge.distro { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.eyebrow { font: 600 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .16em; color: var(--accent2); }

/* ---------- Hero ---------- */
.hero { position: relative; margin: 0 -16px; padding: 22px 16px 26px; overflow: hidden; border-bottom: 1px solid var(--line); }
#hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero-in { position: relative; display: grid; gap: 14px; max-width: 760px; }
.hero-t { font: 700 clamp(44px, 13vw, 84px)/.92 var(--f-display); letter-spacing: -.01em; }
.hero-t span { color: var(--accent); text-shadow: 0 0 28px color-mix(in srgb, var(--accent) 45%, transparent); }
.hero-s { font-size: 16.5px; max-width: 34em; color: var(--fg); }
.hero-term .term-out { height: 158px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 4px 0 0; }
.stats div { border-left: 2px solid var(--line); padding-left: 10px; }
.stats dt { font-size: 11.5px; color: var(--muted); }
.stats dd { margin: 0; font-size: 24px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }

.block { padding: 26px 0 6px; }
.block-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.block-h h2, .pg-t { font: 700 24px/1.15 var(--f-display); letter-spacing: .01em; }
.pg-t { font-size: 30px; margin: 4px 0 6px; }
.lead { color: var(--muted); font-size: 16px; margin-bottom: 14px; }

.sec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.sec-card {
  position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; column-gap: 12px; row-gap: 2px;
  text-align: left; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); transition: transform .2s, border-color .2s;
}
.sec-card:hover { transform: translateY(-2px); border-color: hsl(var(--h) 80% var(--l-acc)); }
.sec-n { position: absolute; top: 12px; right: 14px; font-size: 12px; color: var(--muted); }
.sec-ic { grid-row: 1 / span 3; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: hsl(var(--h) 80% var(--l-acc)); background: color-mix(in srgb, hsl(var(--h) 80% var(--l-acc)) 14%, transparent); }
.sec-card b { font: 600 16px var(--f-display); padding-right: 24px; }
.sec-card small { color: var(--muted); font-size: 13px; line-height: 1.45; }
.sec-c { font: 12px var(--f-mono); color: hsl(var(--h) 80% var(--l-acc)); margin-top: 4px; }
.lab-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.lab-chip { flex: 0 0 210px; scroll-snap-align: start; display: grid; gap: 4px; text-align: left; padding: 12px; border-radius: var(--r); border: 1px dashed var(--line); background: var(--surface2); }
.lab-chip .ic { color: var(--accent2); }
.lab-chip small, .lab-card small { color: var(--muted); font-size: 12.5px; line-height: 1.4; }

/* ---------- Pages ---------- */
.page { padding-top: 6px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13.5px; margin-bottom: 8px; padding: 4px 0; }
.back:hover { color: var(--accent); }
.back .ic { width: 16px; height: 16px; }
.learn-sec { margin-top: 18px; }
.ls-h { display: flex; gap: 12px; align-items: baseline; text-align: left; padding: 6px 0 8px; }
.ls-h .sec-n { position: static; color: hsl(var(--h) 80% var(--l-acc)); }
.ls-h b { font: 600 18px var(--f-display); display: block; }
.ls-h small { color: var(--muted); font-size: 13px; }
.topic-list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.topic-row { display: flex; align-items: center; gap: 12px; padding: 12px 12px; text-align: left; background: var(--surface); min-width: 0; }
.topic-row:hover { background: var(--surface2); }
.topic-row > .ic { color: var(--muted); width: 18px; }
.tr-n { width: 22px; flex: none; color: hsl(var(--h, 38) 80% var(--l-acc)); font-size: 13px; }
.tr-b { display: grid; gap: 2px; flex: 1; min-width: 0; }
.tr-b b { font-weight: 600; }
.tr-b small { color: var(--muted); font-size: 13px; }
.tr-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }

/* ---------- Topic ---------- */
.tabs {
  position: sticky; top: calc(var(--hdr-h) + 0px); z-index: 10; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 6px 0 16px;
}
.tab { padding: 8px 4px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.tab.on { background: var(--accent); color: var(--accent-ink); }
.prose p { margin: 0 0 12px; max-width: 65ch; }
.prose b { color: var(--fg); }
.prose code, .callout code, .terms code { font-size: .9em; padding: 1px 5px; border-radius: 5px; background: var(--surface2); border: 1px solid var(--line); }
.sub { font: 600 15px var(--f-display); margin: 18px 0 8px; letter-spacing: .02em; }
.terms { display: grid; gap: 1px; margin: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); }
.terms div { display: grid; grid-template-columns: minmax(80px, 34%) 1fr; gap: 10px; padding: 9px 12px; background: var(--surface); }
.terms dt { color: var(--accent2); font-size: 13.5px; overflow-wrap: anywhere; }
.terms dd { margin: 0; font-size: 14px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); margin: 14px 0; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 11px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--surface2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.mono { white-space: nowrap; color: var(--accent2); font-size: 13px; }
.codebox { position: relative; background: var(--term-bg); color: var(--term-fg); border-radius: var(--r); border: 1px solid var(--term-line); }
.codebox pre { margin: 0; padding: 14px; overflow-x: auto; font-size: 13px; line-height: 1.55; }
.codebox .ibtn { position: absolute; top: 8px; right: 8px; background: var(--term-line); color: var(--term-fg); border-color: transparent; }
.callout { border-radius: var(--r); padding: 11px 13px; margin: 12px 0; border: 1px solid var(--line); background: var(--surface); }
.callout b { font: 600 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; }
.callout p { margin-top: 4px; font-size: 14px; }
.callout.tip b { color: var(--accent2); } .callout.warn b { color: var(--bad); } .callout.note b { color: var(--accent); }
.callout.warn { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.next-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.pn-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
.pn { display: grid; gap: 2px; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.pn.nx { text-align: right; }
.pn small { color: var(--muted); font-size: 12px; }
.pn b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* commands */
.cmd-list { display: grid; gap: 10px; }
.cmd-row { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px; min-width: 0; }
.cmd-row.flash { animation: flash 1.8s ease; }
@keyframes flash { 0%, 40% { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); } }
.cmd-top { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.cmd-top code { font-size: 14px; overflow-wrap: anywhere; flex: 1 1 200px; min-width: 0; line-height: 1.5; }
.cmd-desc { color: var(--muted); font-size: 13.5px; margin: 4px 0 10px; }
.cmd-acts { display: flex; gap: 6px; align-items: center; }
.cmd-res { margin-top: 10px; }
.cmd-res .term-out { max-height: 260px; }
.h-cmd { color: var(--accent); font-weight: 600; } .h-flag { color: var(--accent2); } .h-str { color: var(--k-file); } .h-op { color: var(--k-kernel); font-weight: 700; }

/* ---------- Animation ---------- */
.anim-stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; overflow-x: auto;
  background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0); background-size: 18px 18px; }
.anim-svg { display: block; width: 100%; max-width: 560px; margin: 0 auto; height: auto; min-width: 300px; }
.anim-svg .edge { stroke: var(--line); stroke-width: 2; transition: stroke .3s, opacity .3s; }
.anim-svg .edge.on { stroke: var(--accent); }
.anim-svg .arw { fill: var(--muted); }
.anim-svg .node.hidden, .anim-svg .edge.hidden { opacity: 0; }
.anim-svg .pkt { fill: var(--accent); filter: drop-shadow(0 0 4px var(--accent)); }
.anim-svg .node rect { fill: var(--surface2); stroke-width: 1.6; transition: fill .3s, stroke-width .3s; }
.anim-svg .node text { font: 600 11px var(--f-mono); fill: var(--fg); }
.anim-svg .node { transition: opacity .35s; }
.anim-svg .node.dim { opacity: .38; }
.anim-svg .node.hi rect { stroke-width: 2.6; }
.k-user rect { stroke: var(--k-user); } .k-proc rect { stroke: var(--k-proc); } .k-kernel rect { stroke: var(--k-kernel); } .k-file rect { stroke: var(--k-file); } .k-hw rect { stroke: var(--k-hw); }
.k-user.hi rect { fill: color-mix(in srgb, var(--k-user) 22%, var(--surface2)); }
.k-proc.hi rect { fill: color-mix(in srgb, var(--k-proc) 22%, var(--surface2)); }
.k-kernel.hi rect { fill: color-mix(in srgb, var(--k-kernel) 22%, var(--surface2)); }
.k-file.hi rect { fill: color-mix(in srgb, var(--k-file) 22%, var(--surface2)); }
.k-hw.hi rect { fill: color-mix(in srgb, var(--k-hw) 22%, var(--surface2)); }
.anim-svg .node.hi { animation: pop .5s ease; transform-box: fill-box; }
@keyframes pop { 40% { filter: brightness(1.4); } }
.anim-cap { min-height: 3.2em; margin: 10px 2px 8px; font-size: 15px; }
.cap-n { font: 600 12px var(--f-mono); color: var(--accent); margin-right: 4px; }
.anim-ctrl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.a-dots { display: flex; gap: 6px; flex: 1; justify-content: center; min-width: 0; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); transition: background .2s, transform .2s; }
.dot.done { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.dot.on { background: var(--accent); transform: scale(1.35); }

/* ---------- Terminal ---------- */
.term { background: var(--term-bg); color: var(--term-fg); border-radius: var(--r); border: 1px solid var(--term-line); overflow: hidden; box-shadow: var(--shadow); }
.term-bar { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--term-line); }
.tdot { width: 9px; height: 9px; border-radius: 50%; background: var(--term-line); }
.tdot:nth-child(1) { background: #ff6b6b; } .tdot:nth-child(2) { background: #ffcf5a; } .tdot:nth-child(3) { background: #4fd18b; }
.term-title { flex: 1; text-align: center; font-size: 11.5px; color: var(--term-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.term-bar .ibtn { background: transparent; border-color: var(--term-line); color: var(--term-dim); width: 28px; height: 28px; }
.term-out { padding: 10px 12px; font-size: 12.8px; line-height: 1.5; overflow: auto; white-space: pre-wrap; word-break: break-word; }
#term-out { height: min(52vh, 440px); }
.tl { margin: 0; }
.tl.dim { color: var(--term-dim); }
.tl.note { color: var(--term-dim); font-style: italic; }
.tl.reveal { animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: .3; } }
.p-u { color: #4fd18b; font-weight: 600; } .p-p { color: #79aaff; font-weight: 600; }
.t-cmd { color: var(--term-fg); }
.caret { display: inline-block; width: 7px; height: 1.05em; vertical-align: -2px; background: #ffb347; animation: blink 1s steps(1) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.c-d { color: #79aaff; font-weight: 600; } .c-l { color: #45d3c0; } .c-x { color: #4fd18b; font-weight: 600; }
.c-m { color: #ff7a7a; font-weight: 700; } .c-n { color: #4fd18b; } .c-p { color: #c79bff; } .c-err { color: #ff8f8f; }
.term-in { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-top: 1px solid var(--term-line); }
.tp { font-size: 12.5px; white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; }
.term-in input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--term-fg); font-size: 14px; height: 34px; caret-color: #ffb347; }
.term-in .ibtn { width: 36px; height: 36px; }
.quick { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; }
.quick .chip { font-size: 12px; }
.tb { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.tb summary { display: flex; align-items: center; gap: 8px; padding: 12px; font-weight: 600; cursor: pointer; list-style: none; }
.tb summary::-webkit-details-marker { display: none; }
.tb-chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 10px; }
.tb-filter { display: flex; gap: 8px; padding: 0 12px 10px; }
.tb-filter .search { flex: 1; min-width: 0; height: 38px; }
.tb-list { list-style: none; margin: 0; padding: 0 6px 8px; max-height: 360px; overflow: auto; }
.tb-list button { display: grid; gap: 2px; width: 100%; text-align: left; padding: 8px 8px; border-radius: 8px; }
.tb-list button:hover { background: var(--surface2); }
.tb-list code { font-size: 12.8px; overflow-wrap: anywhere; }
.tb-list small { color: var(--muted); font-size: 12.5px; }
.tb-list li.muted { padding: 8px; }

/* ---------- Labs ---------- */
.lab { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px; margin-bottom: 16px; }
.lab-top { margin-bottom: 10px; }
.lab-top h3, .demo-h h3 { display: flex; align-items: center; gap: 8px; font: 600 16px var(--f-display); }
.lab-top .ic, .demo-h .ic { color: var(--accent2); }
.lab-body { display: grid; gap: 12px; min-width: 0; }
.lab-body > *, .pipe-flow > *, .demo-box > *, .cron-out > * { min-width: 0; }
.lab-h { font: 600 14px var(--f-display); margin-top: 6px; }
.lab-index { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.lab-card { display: grid; gap: 4px; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.lab-card:hover { border-color: var(--accent2); }
.lab-card .ic { color: var(--accent2); }
.lab-cmd { display: flex; align-items: center; gap: 6px; background: var(--term-bg); color: var(--term-fg); border-radius: 10px; padding: 6px 6px 6px 12px; min-width: 0; }
.lab-cmd code { flex: 1; min-width: 0; font-size: 13px; overflow-x: auto; white-space: nowrap; }
.lab-cmd .ibtn { background: transparent; border-color: var(--term-line); color: var(--term-fg); }
.field { display: grid; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input:not([type=range]), textarea { height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); outline: 0; font-size: 15px; width: 100%; }
.field input:focus, textarea:focus { border-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
textarea { height: auto; padding: 10px; font: 12.5px/1.5 var(--f-mono); resize: vertical; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.term-line { background: var(--term-bg); color: var(--term-fg); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; overflow-x: auto; white-space: pre; margin: 0; }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); justify-self: start; }
.segb { padding: 6px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.segb.on { background: var(--accent); color: var(--accent-ink); }
.perm-grid { display: grid; grid-template-columns: 64px repeat(3, 1fr); gap: 6px; align-items: center; }
.ph { font: 11px var(--f-mono); color: var(--muted); text-align: center; }
.pw { font-size: 13px; font-weight: 600; }
.pbit { height: 44px; border-radius: 10px; border: 1px dashed var(--line); font: 700 18px var(--f-mono); color: var(--muted); transition: all .18s; }
.pbit.on { border-style: solid; border-color: var(--accent); color: var(--accent-ink); background: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent); }
.perm-out { display: flex; gap: 14px; align-items: center; }
.big-oct { font: 700 44px/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.um-rows { display: grid; gap: 8px; }
.um-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); }
.um-l { font-weight: 600; }
.um-calc { display: flex; gap: 8px; font-size: 13px; } .um-calc .hl { color: var(--accent); font-weight: 700; }
.um-s { grid-column: 1 / -1; color: var(--accent2); font-size: 15px; }
.fhs-list { display: flex; flex-wrap: wrap; gap: 6px; }
.fhs-item { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); font: 13px var(--f-mono); background: var(--surface2); }
.fhs-item .ic { width: 15px; height: 15px; color: var(--k-file); }
.fhs-item.on { border-color: var(--accent); color: var(--accent); }
.fhs-info { display: grid; gap: 8px; animation: fadeIn .25s ease; }
.fhs-info h4 { font-size: 18px; color: var(--accent); }
.pipe-stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 6px; }
.pst { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 9px; background: var(--surface2); border: 1px solid var(--line); font: 12.5px var(--f-mono); color: var(--fg); min-width: 0; }
.pst input[type=checkbox] { accent-color: var(--accent); }
.pst .mini { height: 26px; width: 60px; padding: 0 6px; font-size: 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); margin-left: auto; }
.pipe-flow { display: grid; gap: 0; }
.pipe-box { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; animation: slideIn .35s ease both; }
@keyframes slideIn { from { opacity: 0; transform: translateY(6px); } }
.pipe-h { padding: 6px 10px; background: var(--surface2); font-size: 12.5px; color: var(--accent); }
.pipe-box pre { margin: 0; padding: 8px 10px; background: var(--term-bg); color: var(--term-fg); font-size: 12px; overflow-x: auto; }
.pipe-arrow { font: 11px var(--f-mono); color: var(--accent2); padding: 4px 14px; }
.grep-out { background: var(--term-bg); color: var(--term-fg); border-radius: 10px; padding: 10px 12px; font-size: 12px; overflow-x: auto; }
.grep-out mark { background: #ff7a7a; color: #160606; }
.gl { white-space: pre; } .ln { color: #4fd18b; }
.g-sum { margin-top: 8px; color: var(--term-dim); font-size: 11.5px; }
.mini-d summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.mini-d textarea { margin-top: 8px; }
.proc-list { display: grid; gap: 6px; }
.proc { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); transition: opacity .3s; }
.proc.on { border-color: var(--accent); }
.proc.dead { opacity: .45; }
.proc.zap { animation: zap .5s ease; }
@keyframes zap { 30% { transform: translateX(-4px); border-color: var(--bad); } 60% { transform: translateX(3px); } }
.pid { color: var(--accent); font-size: 13px; }
.pname small { display: block; color: var(--muted); font-size: 11.5px; }
.pst-b { font: 600 11px var(--f-mono); padding: 3px 7px; border-radius: 6px; border: 1px solid var(--line); }
.st-S { color: var(--accent2); } .st-T { color: var(--warn); } .st-X { color: var(--bad); }
.sg-log { display: grid; gap: 4px; max-height: 160px; overflow: auto; font-size: 12px; }
.sg-e { padding: 6px 9px; border-radius: 8px; background: var(--term-bg); color: var(--term-fg); animation: fadeIn .25s ease; }
.membar { display: flex; height: 22px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
.membar i { transition: width .3s; }
.used { background: var(--accent); } .cache { background: var(--accent2); opacity: .7; } .free { background: var(--surface2); }
.mem-leg { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cores { display: flex; flex-wrap: wrap; gap: 6px; }
.core { position: relative; width: 38px; height: 54px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface2); overflow: hidden; display: flex; align-items: flex-end; }
.core i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent2); transition: height .3s; }
.core.queue { border-style: dashed; border-color: var(--bad); }
.core.queue i { background: var(--bad); }
.core span { position: relative; width: 100%; text-align: center; font: 9.5px var(--f-mono); padding-bottom: 2px; }
.cron-fields { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 11px; color: var(--muted); text-align: center; }
.cron-en { font: 600 17px var(--f-display); color: var(--accent); margin-bottom: 8px; }
.cron-next { margin: 4px 0 10px; padding-left: 22px; font-size: 13px; }
.cron-out { display: grid; gap: 4px; }
.bits { display: flex; flex-wrap: wrap; gap: 2px 1px; font-size: 13px; align-items: center; }
.bits i { font-style: normal; width: 10px; text-align: center; border-radius: 2px; }
.bits i.n { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.bits i.h { color: var(--accent2); }
.bits b { color: var(--muted); padding: 0 1px; }
.bits-leg { flex-basis: 100%; display: flex; gap: 12px; font-size: 11.5px; margin-top: 4px; }
.bits-leg .n { color: var(--accent); } .bits-leg .h { color: var(--accent2); }
.kv { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kv > div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--surface2); font-size: 13.5px; }
.kv > div b { color: var(--fg); overflow-wrap: anywhere; text-align: right; }
.kv .lab-cmd { border-radius: 0; }
.pk-rows { display: grid; gap: 8px; }
.pk-row { display: grid; gap: 6px; animation: slideIn .3s ease both; }
.pk-fam { display: flex; align-items: baseline; gap: 8px; }
.pk-fam b { color: var(--accent); } .pk-fam small { color: var(--muted); font-size: 12px; }
.demo-box { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px; display: grid; gap: 10px; }
.demo-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#demo-term .term-out { height: 230px; }

/* ---------- Player ---------- */
#player {
  --trk: 32; --viz: hsl(var(--trk) 90% 62%);
  position: fixed; z-index: 39; right: max(10px, env(safe-area-inset-right, 0px)); left: max(10px, env(safe-area-inset-left, 0px));
  bottom: calc(var(--bnav-h) + 8px); max-width: 460px; margin-left: auto;
  border-radius: 16px; border: 1px solid color-mix(in srgb, var(--viz) 45%, var(--line)); box-shadow: var(--shadow);
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  animation: slideIn .3s ease;
}
:root[data-theme="light"] #player { --viz: hsl(var(--trk) 75% 42%); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) #player { --viz: hsl(var(--trk) 75% 42%); } }
.pl-body { padding: 10px; display: grid; gap: 8px; }
.pl-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
#pl-viz { width: 64px; height: 36px; flex: none; border-radius: 8px; background: var(--surface2); }
.pl-meta { display: grid; min-width: 0; flex: 1; }
.pl-meta b { font: 600 15px var(--f-display); color: var(--viz); }
.pl-meta small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-num { font-size: 11px; color: var(--muted); }
.pl-ctrls { display: flex; align-items: center; gap: 5px; }
.pl-ctrls .ibtn { width: 34px; height: 34px; }
#pl-play { background: var(--viz); border-color: var(--viz); color: var(--accent-ink); }
:root:not([data-theme="light"]) #pl-play { color: #10131a; }
.pl-vol { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; color: var(--muted); }
.pl-vol .ic { width: 17px; height: 17px; }
.pl-vol input { accent-color: var(--viz); min-width: 0; }
.pl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; border-top: 1px solid var(--line); max-height: 38vh; overflow-y: auto; padding-top: 6px; }
.pl-list button { display: grid; grid-template-columns: 20px auto 1fr; gap: 8px; align-items: baseline; width: 100%; text-align: left; padding: 7px 8px; border-radius: 8px; }
.pl-list button:hover { background: var(--surface2); }
.pl-list .on button { background: var(--surface2); }
.pl-list .on b { color: var(--viz); }
.pl-list span { color: var(--muted); font-size: 12px; }
.pl-list small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-bubble { display: none; }
#player.mini { left: auto; width: 52px; height: 52px; border-radius: 50%; padding: 0; }
#player.mini .pl-body { display: none; }
#player.mini .pl-bubble { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; cursor: pointer; }
.eq { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
.eq i { width: 4px; background: var(--viz); border-radius: 2px; height: 30%; }
#player.playing .eq i { animation: eq 0.9s ease-in-out infinite; }
#player.playing .eq i:nth-child(2) { animation-delay: .2s; } #player.playing .eq i:nth-child(3) { animation-delay: .4s; }
@keyframes eq { 50% { height: 100%; } }

/* ---------- Help sheet + spotlight ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(5, 8, 14, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card {
  width: 100%; max-width: 640px; max-height: 88vh; display: flex; flex-direction: column; gap: 10px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 18px 18px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transform: translateY(20px); opacity: 0; transition: transform .25s, opacity .25s;
}
.sheet.show .sheet-card { transform: none; opacity: 1; }
.sheet-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.sheet-h h2 { font: 700 21px var(--f-display); }
.mini-s { height: 38px; }
.help-scroll { overflow: auto; overscroll-behavior: contain; padding-bottom: 8px; }
.help-g { font: 600 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--accent2); margin: 14px 0 6px; }
.help-scroll ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.help-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.help-item:hover { border-color: var(--accent); }
.hi-t { font-weight: 600; }
.hi-d { grid-column: 1; color: var(--muted); font-size: 13px; line-height: 1.45; }
.hi-go { grid-column: 2; grid-row: 1 / span 2; align-self: center; display: inline-flex; align-items: center; color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap; }
.hi-go .ic { width: 15px; height: 15px; }
#spot { position: fixed; inset: 0; z-index: 70; }
#spot-ring { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(4, 7, 13, .62), 0 0 0 2px var(--accent), 0 0 24px var(--accent); transition: all .3s ease; pointer-events: none; }
#spot.show #spot-ring { animation: ring 1.6s ease-in-out infinite; }
@keyframes ring { 50% { box-shadow: 0 0 0 9999px rgba(4, 7, 13, .62), 0 0 0 4px var(--accent), 0 0 34px var(--accent); } }
#spot-tip { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); max-width: 420px; margin: 0 auto; background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 6px; }
#spot-tip b { font: 600 15px var(--f-display); color: var(--accent); }
#spot-tip p { font-size: 13.5px; }
.tip-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

/* ---------- Footer, toast ---------- */
.foot { margin-top: 36px; padding: 20px 0 6px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 13.5px; }
.foot-brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); }
.foot .btn { justify-self: start; margin-top: 6px; }
#toast { position: fixed; z-index: 80; left: 50%; bottom: calc(var(--bnav-h) + var(--pl-h) + 16px); transform: translate(-50%, 10px); opacity: 0; transition: all .25s; background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

:root:not([data-mode="mobile"]) .hero { margin: 0; border: 1px solid var(--line); border-radius: 18px; padding: 34px; }
:root:not([data-mode="mobile"]) .hero-in { grid-template-columns: 1.1fr 1fr; align-items: start; column-gap: 28px; max-width: none; }
:root:not([data-mode="mobile"]) .hero-in > :not(.hero-term) { grid-column: 1; }
:root:not([data-mode="mobile"]) .hero-term { grid-column: 2; grid-row: 1 / span 5; align-self: center; }
:root:not([data-mode="mobile"]) .hero-term .term-out { height: 250px; }
:root:not([data-mode="mobile"]) .lab-strip { margin: 0; padding-left: 0; padding-right: 0; }
@media (max-width: 360px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .hdr-acts { gap: 4px; } .ibtn { width: 35px; height: 35px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ---------- Home: theory → example folder → use it ---------- */
.ex-intro { margin: -4px 0 14px; max-width: 60ch; }
.ex-step { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; flex-wrap: wrap; }
.ex-step h3 { font: 600 17px var(--f-display); }
.ex-sn { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 14px; flex: none; }
.ex-hint { margin-left: auto; }
.ex-reset { margin-left: auto; }
.ex-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scroll-behavior: smooth; }
.ex-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.ex-concept { display: grid; gap: 10px; }
.ex-concept p { max-width: 65ch; }
.ex-concept code, .ex-infolder code { font-size: .9em; padding: 1px 5px; border-radius: 5px; background: var(--surface2); border: 1px solid var(--line); overflow-wrap: anywhere; }
.ex-ct { font: 700 20px var(--f-display); color: var(--accent); }
.ex-infolder { border-left: 3px solid var(--accent2); padding: 8px 12px; background: var(--surface2); border-radius: 0 10px 10px 0; display: grid; gap: 4px; }
.ex-infolder > b { display: flex; align-items: center; gap: 6px; font: 600 12px var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--accent2); }
.ex-infolder .ic { width: 15px; height: 15px; }
.ex-try, .ex-cmd { display: flex; align-items: center; gap: 8px; background: var(--term-bg); color: var(--term-fg); border-radius: 10px; padding: 6px 6px 6px 12px; min-width: 0; }
.ex-try code, .ex-cmd code { flex: 1; min-width: 0; font-size: 12.8px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
.ex-note { margin-top: 4px; }
.ex-cmd .ibtn { background: transparent; border-color: var(--term-line); color: var(--term-fg); }
.ex-nav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ex-grid { display: grid; gap: 10px; }
.ex-tree { padding: 6px; display: grid; gap: 1px; }
.ex-row { position: relative; display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px calc(8px + var(--d) * 18px); border-radius: 8px; text-align: left; min-width: 0; transition: background .2s; }
.ex-row::before { content: ""; position: absolute; left: calc(var(--d) * 18px - 6px); top: 0; bottom: 0; width: 1px; background: var(--line); }
.ex-row[style*="--d:0"]::before { display: none; }
.ex-row:hover { background: var(--surface2); }
.ex-row.on { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); box-shadow: inset 0 0 0 1px var(--accent); }
.ex-row.hi .ex-name { color: var(--accent); }
.ex-row.hi .ex-ic { color: var(--accent); animation: glow 1.8s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 5px var(--accent)); } }
.ex-ic { display: grid; place-items: center; color: var(--muted); flex: none; }
.ex-ic .ic { width: 17px; height: 17px; }
.ex-row.dir .ex-ic { color: var(--k-file); }
.ex-name { font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-name small { color: var(--muted); }
.ex-row.hid .ex-name { opacity: .8; font-style: italic; }
.ex-tag { font: 10px var(--f-mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 5px; padding: 1px 5px; flex: none; }
.ex-perm { font-size: 11.5px; color: var(--accent2); flex: none; }
.ex-detail { display: grid; gap: 10px; animation: fadeIn .25s ease; }
.ex-dh { display: flex; align-items: center; gap: 10px; }
.ex-dh b { font-size: 16px; display: block; overflow-wrap: anywhere; }
.ex-dh small { color: var(--muted); font-size: 12.5px; }
.ex-ic.big { width: 38px; height: 38px; border-radius: 10px; background: var(--surface2); color: var(--accent); }
.ex-what { font-size: 14.5px; }
.ex-kv { display: grid; gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ex-kv > div { display: grid; gap: 2px; padding: 8px 11px; background: var(--surface2); }
.ex-kv dt { font: 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ex-kv dd { margin: 0; font-size: 13.5px; overflow-wrap: anywhere; }
.ex-who { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 2px; font-size: 13px; }
.ex-who b { font-weight: 600; margin-right: 4px; }
.ex-ls { white-space: pre; }
.ex-h4 { font: 600 14px var(--f-display); }
.ex-cmds { display: grid; gap: 6px; }
#ex-term .term-out { height: 220px; }
:root:not([data-mode="mobile"]) .ex-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; }
:root:not([data-mode="mobile"]) .ex-chips { margin: 0; padding-left: 0; padding-right: 0; flex-wrap: wrap; }
.ex-prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.ex-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; }
.ex-bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.ex-grp { align-self: center; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent2); padding: 0 2px 0 6px; white-space: nowrap; }
.ex-grp:first-child { padding-left: 0; }
.ex-keys, .ex-mistake { display: grid; gap: 4px; }
.ex-keys > b, .ex-mistake > b { font: 600 12px var(--f-mono); text-transform: uppercase; letter-spacing: .1em; }
.ex-keys > b { color: var(--accent); }
.ex-keys ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.ex-keys li::marker { color: var(--accent); }
.ex-mistake { border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); border-radius: 10px; padding: 8px 12px; }
.ex-mistake > b { color: var(--bad); }
.ex-mistake p { font-size: 14px; }
.ex-keys code, .ex-mistake code { font-size: .9em; padding: 1px 5px; border-radius: 5px; background: var(--surface2); border: 1px solid var(--line); overflow-wrap: anywhere; }

/* ---- v1.3: progress, path, quiz, challenges, try-it ---- */
.good { color: var(--good); }
.pg-row { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
.pg-row .pg-t { min-width: 0; overflow-wrap: anywhere; }
.ibtn.bm { flex: none; margin-top: 6px; }
.ibtn.bm.on { color: var(--accent); border-color: var(--accent); }
.topic-end { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
#done-btn.on { background: transparent; color: var(--good); border: 1px solid var(--good); }
.report, .link.sm { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.report:hover, .link.sm:hover { color: var(--accent); }
.report .ic { width: 15px; height: 15px; }
.foot-links { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.topic-row.done .tr-n { color: var(--good); }
.topic-row.done .tr-n .ic { width: 16px; height: 16px; }
.ls-h.static { display: flex; align-items: center; gap: 12px; padding: 12px 4px; text-align: left; }
.ls-h.static .ic { width: 20px; height: 20px; color: var(--accent); }
.sec-prog { margin: 4px 0 14px; }

.cont { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.cont-top { display: flex; justify-content: space-between; align-items: baseline; font: 600 15px var(--f-display); }
.cont-top .mono { color: var(--accent); font-size: 15px; }
.cont-n { line-height: 1.5; }
.cont-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.cont-acts .btn { max-width: 100%; text-align: left; }
.cont-bm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cont-bm .ic { width: 14px; height: 14px; color: var(--accent); vertical-align: -2px; }

.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.path li > button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; min-height: 52px; }
.path li > button:hover { border-color: var(--accent2); }
.path li.next > button { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.pa-n { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); color: var(--muted); flex: none; font-size: 13px; }
.pa-n .ic { width: 16px; height: 16px; }
.path li.done .pa-n { background: color-mix(in srgb, var(--good) 20%, var(--surface)); color: var(--good); }
.path li.next .pa-n { background: var(--accent); color: var(--accent-ink); }
.pa-b { display: grid; gap: 1px; flex: 1; min-width: 0; }
.pa-b b { font-weight: 600; overflow-wrap: anywhere; }
.pa-b small { color: var(--muted); font: 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; }
.path li > button > .ic { color: var(--muted); width: 18px; flex: none; }

.ex-chips .chip.done::after { content: " ✓"; color: var(--good); }
.ex-chips .chip.done.on::after { color: var(--accent-ink); }
.ex-try .ibtn { background: transparent; border-color: var(--term-line); color: var(--term-fg); }
.ex-chal { display: grid; gap: 10px; }
.ex-chal .ex-h4 { font-size: 17px; display: flex; align-items: center; gap: 6px; }
.ex-chal .ex-h4 .ic { color: var(--good); width: 18px; }
.ex-chal .chal-hint { display: grid; gap: 8px; }

.tryit { margin-top: 18px; padding: 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent2); border-radius: 0 var(--r) var(--r) 0; background: var(--surface); display: grid; gap: 10px; min-width: 0; }
.tryit .sub { margin: 0; }
.tryit .ex-cmd code { font-size: 12.8px; }
#tryit-term .term-out { height: 190px; }

.quiz { margin-top: 24px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 10px; }
.quiz-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.quiz-h h3 { display: flex; align-items: center; gap: 8px; font: 600 17px var(--f-display); }
.quiz-h .ic { width: 18px; height: 18px; color: var(--accent2); }
.quiz-body { display: grid; gap: 10px; }
.qz-q { font: 600 17px/1.4 var(--f-display); }
.qz-opts { display: grid; gap: 8px; }
.qz-opt { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); min-height: 48px; font-size: 15px; overflow-wrap: anywhere; }
.qz-opt:hover:not(:disabled) { border-color: var(--accent2); }
.qz-opt:disabled { cursor: default; opacity: .75; }
.qz-opt.ok { opacity: 1; border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface2)); }
.qz-opt.bad { opacity: 1; border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface2)); }
.qz-fb { display: grid; gap: 10px; }
.qz-fb p { font-size: 14.5px; }
.qz-end { display: flex; align-items: center; gap: 14px; }
.qz-score { font-size: 40px; font-weight: 700; color: var(--bad); line-height: 1; }
.qz-end.pass .qz-score { color: var(--good); }
.qz-score small { font-size: 18px; color: var(--muted); }

:root[data-mode="mobile"] .ex-tree { padding: 4px; }
:root[data-mode="mobile"] .ex-row { min-height: 46px; padding-top: 9px; padding-bottom: 9px; gap: 10px; }
:root[data-mode="mobile"] .ex-ic .ic { width: 20px; height: 20px; }
:root[data-mode="mobile"] .ex-name { font-size: 15px; }
:root[data-mode="mobile"] .ex-perm { font-size: 12.5px; }
.tour-btn { width: 100%; justify-content: center; margin: 0 0 10px; }
.tip-n { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
#spot-tip .tip-acts { flex-wrap: wrap; }
#spot-tip .tip-acts .btn[disabled] { opacity: .4; pointer-events: none; }

/* ---- Colour palettes: override accent tokens only. Dark values first, light values (darker, for contrast) after. ---- */
:root[data-palette="ocean"] { --accent: #5cc8ff; --accent-ink: #04131c; --accent2: #7ee0c3; }
:root[data-palette="violet"] { --accent: #b79bff; --accent-ink: #140d26; --accent2: #ff9ad5; }
:root[data-palette="rose"] { --accent: #ff7a9c; --accent-ink: #230a12; --accent2: #ffc46b; }
:root[data-palette="forest"] { --accent: #6fe3a1; --accent-ink: #06180e; --accent2: #d6e85a; }
:root[data-palette="slate"] { --accent: #cfd6e6; --accent-ink: #0c1018; --accent2: #8fa3c8; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"])[data-palette="ocean"] { --accent: #0a69a8; --accent-ink: #fff; --accent2: #0b7d6a; }
  :root:not([data-theme="dark"])[data-palette="violet"] { --accent: #6a45d6; --accent-ink: #fff; --accent2: #b0286f; }
  :root:not([data-theme="dark"])[data-palette="rose"] { --accent: #c2285a; --accent-ink: #fff; --accent2: #8a5a00; }
  :root:not([data-theme="dark"])[data-palette="forest"] { --accent: #1c7a45; --accent-ink: #fff; --accent2: #6b7a00; }
  :root:not([data-theme="dark"])[data-palette="slate"] { --accent: #2c3a55; --accent-ink: #fff; --accent2: #4a5f8a; }
}
:root[data-theme="light"][data-palette="ocean"] { --accent: #0a69a8; --accent-ink: #fff; --accent2: #0b7d6a; }
:root[data-theme="light"][data-palette="violet"] { --accent: #6a45d6; --accent-ink: #fff; --accent2: #b0286f; }
:root[data-theme="light"][data-palette="rose"] { --accent: #c2285a; --accent-ink: #fff; --accent2: #8a5a00; }
:root[data-theme="light"][data-palette="forest"] { --accent: #1c7a45; --accent-ink: #fff; --accent2: #6b7a00; }
:root[data-theme="light"][data-palette="slate"] { --accent: #2c3a55; --accent-ink: #fff; --accent2: #4a5f8a; }
#pal { position: fixed; z-index: 60; width: min(300px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; display: grid; gap: 8px; animation: fadeIn .18s ease; }
#pal h3 { font: 600 14px var(--f-display); }
.pal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pal-opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); text-align: left; font-size: 14px; }
.pal-opt:hover { border-color: var(--accent2); }
.pal-opt[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.pal-dot { width: 24px; height: 24px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--surface); }

.mark { flex: none; overflow: visible; }
.lg-spin { transform-box: view-box; transform-origin: 32px 32px; animation: lgspin 14s linear infinite; }
@keyframes lgspin { to { transform: rotate(360deg); } }
.lg-blink { animation: lgblink 1.1s steps(1) infinite; }
@keyframes lgblink { 50% { opacity: 0; } }

/* ---- A-Z glossary ---- */
.az-promo { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.az-promo:hover { border-color: var(--accent); }
.az-promo b { display: block; font: 600 16px var(--f-display); }
.az-promo small { color: var(--muted); font-size: 13px; line-height: 1.4; display: block; }
.az-big { font-size: 18px; font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 10px; padding: 10px 8px; }
.az-tools { display: grid; gap: 8px; padding: 8px 0 0; }
.az-bar { position: sticky; top: calc(var(--hdr-h, 64px) - 1px); z-index: 5; background: var(--bg); padding: 6px 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.az-bar button { flex: 0 0 32px; height: 32px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface2); font: 600 13px var(--f-mono); }
.az-bar button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.az-bar button:disabled { opacity: .3; }
.az-l { font: 700 28px var(--f-display); color: var(--accent); display: flex; align-items: baseline; gap: 10px; margin: 18px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.az-l small { font-size: 12px; color: var(--muted); }
.az-card { padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.az-card[hidden], .az-sec[hidden] { display: none; }
.az-card h3 { font-size: 15px; margin: 0 0 4px; color: var(--accent2); }
.az-card p { margin: 0 0 6px; font-size: 14px; line-height: 1.5; }
.az-cmd { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.az-cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; padding: 6px 8px; border-radius: 8px; background: var(--surface2); font-size: 12.5px; }
.az-topic { display: inline-flex; align-items: center; gap: 4px; }

/* ---- Device modes: data-mode on <html> is always the effective mode (mobile | tab | web) ---- */
.mode-btn { width: auto; padding: 0 10px; gap: 5px; display: inline-flex; align-items: center; font: 600 12px var(--f-mono); }
.mode-btn .ic { width: 17px; height: 17px; }
.mode-btn small { font: inherit; letter-spacing: .04em; }
.mode-btn .auto { color: var(--accent); }
:root[data-mode="mobile"] .mode-btn small { display: none; }
:root[data-mode="mobile"] .kbd { display: none; }
:root[data-mode="mobile"] .ibtn { width: 37px; height: 37px; }
:root[data-mode="mobile"] .hdr-acts { gap: 4px; }
:root[data-mode="mobile"] .mode-btn { width: 37px; padding: 0; justify-content: center; }
:root[data-mode="mobile"] #bnav button { min-height: 48px; font-size: 12px; }
:root[data-mode="mobile"] .btn { min-height: 44px; }
:root[data-mode="mobile"] .hero-term .term-out { height: 200px; }
:root[data-mode="mobile"] #view, :root[data-mode="mobile"] .hdr-row, :root[data-mode="mobile"] #q-wrap { max-width: 560px; }
:root[data-mode="tab"] #view, :root[data-mode="tab"] .hdr-row, :root[data-mode="tab"] #q-wrap { max-width: 1000px; }
:root[data-mode="tab"] #bnav { grid-template-columns: repeat(4, minmax(0, 150px)); justify-content: center; gap: 8px; }
:root[data-mode="tab"] .btn, :root[data-mode="tab"] .chip { min-height: 42px; }
:root[data-mode="web"] #view, :root[data-mode="web"] .hdr-row, :root[data-mode="web"] #q-wrap { max-width: 1160px; }
:root[data-mode="web"] #bnav { grid-template-columns: repeat(4, minmax(0, 130px)); justify-content: center; gap: 6px; }
:root[data-mode="web"] #bnav button, :root[data-mode="web"] .btn { cursor: pointer; }
:root[data-mode="web"] .hero-term .term-out { height: 290px; }
:root[data-mode="web"] #ex-term .term-out { height: 280px; }

/* labs part 2 */
.lab-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lab-row > .muted { min-width: 84px; }
pre.code { margin: 0; padding: 12px; border-radius: 10px; background: var(--term-bg); color: var(--term-fg); font: 13px/1.5 var(--f-mono); overflow-x: auto; }
.lab .kv dt { color: var(--muted); } .lab .kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; }

/* idea picker */
.ex-chips { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; overflow: visible; margin: 0 0 10px; padding: 0; }
.ex-pick { flex: 1 1 260px; min-width: 0; }
.ex-select { width: 100%; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; }
.ex-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.path-pick { display: block; margin: 0 0 10px; }

/* study games */
.lab-card.game { border-style: dashed; }
.lab-card.game .ic { color: var(--accent); }
.lab-card .badge { justify-self: start; }
.gm-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.gm-stat { display: grid; gap: 1px; padding: 6px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); min-width: 86px; }
.gm-stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.gm-stat b { font: 600 17px var(--f-mono); }
.gm-pairs { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.gm-col { display: grid; gap: 8px; align-content: start; }
.gm-card { text-align: left; padding: 12px; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); transition: border-color .15s, background .15s, transform .15s; }
.gm-card:hover { border-color: var(--accent2); }
.gm-card.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.gm-card.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--surface)); opacity: .85; }
.gm-card.bad, .gm-opt.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.gm-q { font-size: 17px; margin: 6px 0 10px; max-width: 62ch; }
.gm-opts { display: grid; gap: 8px; }
.gm-opt { justify-content: flex-start; text-align: left; white-space: normal; height: auto; min-height: 44px; padding: 10px 14px; }
.gm-opt.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--surface)); }
.gm-fb { margin-top: 12px; display: grid; gap: 8px; justify-items: start; }
.gm-cmd { margin: 0 0 12px; }

  /* Per-tool knowledge used by `man` and the command pop-up */
  LV.tool = function (map) { for (var k in map) LV.tools[k] = map[k]; };

  /* Storage: localStorage wrapped in try/catch with in-memory fallback */
  var mem = {};

    get: function (k, d) {

  topics: [
    {

      explain: [

        'On its own a kernel does nothing you can see. A usable system adds <b>userland</b>: the GNU core utilities (<code>ls</code>, <code>cp</code>, <code>grep</code>), a shell such as <b>bash</b>, an init system (usually <b>systemd</b>), libraries like glibc, and optionally a desktop.',
        'A <b>distribution</b> (distro) packages the kernel, userland, a package manager and default settings into something you can install. Ubuntu, Debian, Fedora, RHEL, Arch and openSUSE all run the same kind of kernel; they differ in packaging, release rhythm and defaults.',

      terms: [['Kernel', 'Core program managing CPU, memory, devices and processes'], ['Userland', 'Everything outside the kernel: shell, tools, libraries, apps'], ['System call', 'The doorway a program uses to ask the kernel for a service'], ['Distro', 'A packaged, installable Linux operating system']],
      anim: {

LV.add('script', [
  {
    id: 'conditionals', title: 'Conditionals: if, test & case', sum: 'Make a script choose what to do.',
    explain: [
      'An <code>if</code> runs a command and looks at its <b>exit code</b>: 0 means true, anything else means false. The most common command to put there is <code>[[ ... ]]</code> (or the older <code>test</code> / <code>[ ... ]</code>), which compares values and checks files.',
      'Useful checks: <code>-f file</code> (is a regular file), <code>-d dir</code> (is a folder), <code>-e path</code> (exists), <code>-z "$x"</code> (empty text), <code>"$a" = "$b"</code> (same text) and <code>$n -gt 5</code> (number greater than 5).',
      'When one value can match many patterns, <code>case</code> is tidier than a long chain of <code>elif</code>.'
    ],
    code: '#!/usr/bin/env bash\nfile="${1:-notes.txt}"\n\nif [[ -f "$file" ]]; then\n  echo "$file has $(wc -l < "$file") lines"\nelif [[ -d "$file" ]]; then\n  echo "$file is a folder"\nelse\n  echo "$file not found" >&2\n  exit 1\nfi\n\ncase "$2" in\n  start) echo "starting" ;;\n  stop|quit) echo "stopping" ;;\n  *) echo "usage: $0 file start|stop" ;;\nesac',
    terms: [['[[ ]]', 'Bash test: compares text and numbers, checks files'], ['-f / -d / -e', 'Is a file / is a folder / exists'], ['-eq -ne -gt -lt', 'Number comparisons (equal, not equal, greater, less)'], ['&& and ||', 'Run the next command only on success / only on failure'], ['case', 'Pick a branch by matching a value against patterns']],
    table: { head: ['Test', 'True when', 'Example'], rows: [['-f f', 'f is a regular file', '[[ -f notes.txt ]]'], ['-d d', 'd is a directory', '[[ -d logs ]]'], ['-z s', 's is empty', '[[ -z "$name" ]]'], ['a = b', 'text is equal', '[[ "$USER" = root ]]'], ['n -gt m', 'number n is greater than m', '[[ $count -gt 3 ]]']] },
    cmds: [
      ['[[ -f ~/website/index.html ]] && echo yes', 'One-line check: run echo only if the file exists', 'yes'],
      ['[[ -d ~/website/logs ]] && echo "has logs"', 'Is it a folder?', 'has logs'],
      ['test -z "$EMPTY" && echo "empty"', 'test is the same as [ ]', 'empty'],
      ['[[ 5 -gt 3 ]]; echo $?', 'Show the exit code of a comparison (0 = true)', '0'],
      ['[[ -f nope.txt ]] || echo "missing"', 'Run only when the check fails', 'missing'],
      ['help test', 'Built-in help listing every test']
    ],
    flags: [['-f', 'Regular file exists', '[[ ]]'], ['-d', 'Directory exists', '[[ ]]'], ['-r -w -x', 'Readable / writable / executable by you', '[[ ]]'], ['-n / -z', 'Text is not empty / is empty', '[[ ]]']],
    tips: ['Always quote variables inside tests: <code>[[ -f "$file" ]]</code>. Without quotes a name with spaces breaks the check in the older <code>[ ]</code> form.', 'Put the pattern <code>*)</code> last in a case so unexpected input is handled.'],
    warn: ['Spaces matter: <code>[[ -f $f ]]</code> works, <code>[[-f $f]]</code> does not. There must be a space after <code>[[</code> and before <code>]]</code>.'],

LV.add('perms', [
  {

    explain: [
      'Besides rwx there are three special bits. <b>setuid</b> on a program makes it run as the file\'s owner (that is how <code>passwd</code> can edit protected files). <b>setgid</b> on a folder makes new files inherit the folder\'s group. The <b>sticky bit</b> on a folder lets people delete only their own files (that is <code>/tmp</code>).',
      'In <code>ls -l</code> they replace an x: <code>s</code> for setuid/setgid and <code>t</code> for sticky. As numbers they are a fourth leading digit: 4 setuid, 2 setgid, 1 sticky, so <code>chmod 2775 shared</code> sets setgid.',
      'When owner, group and others are not enough, <b>ACLs</b> give extra users or groups their own access: <code>setfacl -m u:alex:rw file</code>.'

    table: { head: ['Bit', 'Number', 'Shown as', 'Typical use'], rows: [['setuid', '4000', 'rws', '/usr/bin/passwd'], ['setgid', '2000', 'rws on group / s on folder', 'Shared team folders'], ['sticky', '1000', 't at the end', '/tmp'], ['ACL', '-', '+ after the mode', 'Extra user access']] },
    cmds: [
      ['ls -l /usr/bin/passwd', 'The s means setuid', '-rwsr-xr-x 1 root root 59976 Nov  5 12:00 /usr/bin/passwd'],
      ['ls -ld /tmp', 'The t means sticky', 'drwxrwxrwt 14 root root 4096 Nov  7 20:30 /tmp'],
      ['chmod 2775 shared', 'Set group inheritance on a shared folder'],
      ['chmod +t shared', 'Turn on the sticky bit'],
      ['find / -perm -4000 -type f 2>/dev/null', 'List setuid programs (a common security audit)'],
      ['setfacl -m u:alex:rw notes.txt', 'Give user alex read and write access'],

    ],
    flags: [['-m', 'Modify an ACL entry', 'setfacl'], ['-x', 'Remove an ACL entry', 'setfacl'], ['-b', 'Remove all ACL entries', 'setfacl'], ['-perm -4000', 'Match files with setuid set', 'find']],
    tips: ['Use setgid on shared team folders so everyone\'s files end up in the team group automatically.'],
    warn: ['A setuid root program with a bug can give an attacker root. Do not set setuid on scripts or on programs you did not audit.']
  }
]);

LV.add('text', [

      ['ls *.html | xargs -I {} cp {} {}.bak', 'Copy each file to a .bak name'],
      ['seq 1 6 | xargs -n 3', 'Group items three per line', '1 2 3\n4 5 6'],

    explain: [

      'To add swap quickly, create a file, set it to private (600), format it with <code>mkswap</code>, enable it with <code>swapon</code> and add a line to <code>/etc/fstab</code> to keep it after reboot.'

      ['sudo fallocate -l 2G /swapfile', 'Create a 2 GB file'],

LV.add('text', [

      '<code>sed</code> edits a stream line by line. The most used command is substitute: <code>s/old/new/</code> replaces the first match on each line; add <code>g</code> for every match. Any character can be the separator, which helps with paths: <code>s|/var|/srv|g</code>.',
      'Add an address before the command to limit it: <code>3d</code> deletes line 3, <code>2,5p</code> prints lines 2 to 5, <code>/error/d</code> deletes lines containing "error".',
      '<code>sed -i</code> edits the file itself. Write <code>-i.bak</code> to keep a backup copy first. Use <code>-n</code> with <code>p</code> to print only what you select.'

LV.add('script', [

    explain: [

/* Linuxverse animation engine: step-by-step SVG diagrams with flowing packets */
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var CW = 6.3, NH = 28, W = 360;

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function boxW(label) { return Math.min(W - 8, Math.max(64, label.length * CW + 22)); }

  /* Clip a centre-to-centre line to the edge of a node box */
  function edgePoint(n, tx, ty) {
    var dx = tx - n.x, dy = ty - n.y;
    if (!dx && !dy) return { x: n.x, y: n.y };
    var hw = n.w / 2 + 3, hh = NH / 2 + 3;
    var s = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
    return { x: n.x + dx * s, y: n.y + dy * s };
  }

  LV.anim = function (host, spec) {
    var nodes = {}, edges = {}, maxY = 0;
    spec.nodes.forEach(function (n) {

  };
  L.quizMount = function (host, secId) {

    }
    function question() {
      var q = Q[st.i];
      st.opts = shuffle(q.o.map(function (t, k) { return { t: t, ok: k === 0 }; })); st.picked = -1;
      body.innerHTML = '<div class="ex-prog"><span class="mono">Question ' + (st.i + 1) + ' of ' + Q.length + '</span><span class="ex-bar"><i style="width:' + (st.i / Q.length * 100) + '%"></i></span></div>' +
        '<p class="qz-q">' + esc(q.q) + '</p><div class="qz-opts" role="group" aria-label="Answers">' + st.opts.map(function (o, k) { return '<button class="qz-opt" data-k="' + k + '">' + esc(o.t) + '</button>'; }).join('') + '</div><div class="qz-fb" id="qz-fb" aria-live="polite"></div>';
    }
    function finish() {
      var all = map('quiz'), prev = all[secId];
      if (prev == null || st.score > prev) { all[secId] = st.score; LV.store.set('quiz', all); }
      var pass = st.score >= 3;
      if (pass) L.setDone('q:' + secId, true);
      body.innerHTML = '<div class="qz-end ' + (pass ? 'pass' : '') + '"><div class="qz-score mono">' + st.score + '<small>/' + Q.length + '</small></div><p><b>' + (st.score === Q.length ? 'Perfect!' : pass ? 'Passed.' : 'Not yet.') + '</b> ' + (pass ? 'Nice work on this section.' : 'Read the topics again and have another go.') + '</p></div>' +
        '<button class="btn" data-qz="start">' + ic('restart') + ' Try again</button>';

      badge.textContent = 'Best ' + b + '/' + Q.length; badge.classList.toggle('b-live', b >= 3);
    }
    host.addEventListener('click', function (e) {
      var s = e.target.closest('[data-qz="start"]');
      if (s) { st = { i: 0, score: 0 }; question(); return; }
      var nx = e.target.closest('[data-qz="next"]');
      if (nx) { st.i++; if (st.i >= Q.length) finish(); else question(); return; }
      var op = e.target.closest('.qz-opt');
      if (op && st && st.picked < 0) {
        var k = +op.dataset.k, o = st.opts[k], btns = $$('.qz-opt', body);
        st.picked = k; if (o.ok) st.score++;
        btns.forEach(function (b, j) { b.disabled = true; if (st.opts[j].ok) b.classList.add('ok'); else if (j === k) b.classList.add('bad'); });
        $('#qz-fb', body).innerHTML = '<p class="' + (o.ok ? 'good' : 'bad') + '"><b>' + (o.ok ? 'Correct.' : 'Not quite.') + '</b> ' + esc(Q[st.i].e) + '</p><button class="btn sm" data-qz="next">' + (st.i + 1 >= Q.length ? 'See score' : 'Next question') + ' ' + ic('chev') + '</button>';
        var nb = $('[data-qz="next"]', body); if (nb) nb.focus({ preventScroll: true });
      }
    });

  };

/* Linuxverse home walkthrough: 1) learn the theory, 2) see it in an example folder, 3) use it on that folder */

      theory: ['Linux treats almost everything as a file: documents, programs, folders, even disks (<code>/dev/sda</code>) and the live system information in <code>/proc</code>. A folder (directory) is just a special file that holds a list of names.',
        'Because of this, the same small set of tools (ls, cat, cp, mv, rm) works on nearly everything, and programs can read a device or a setting the same way they read a document.'],

    { id: 'users', g: 'Security', t: 'Users, groups and root',

    { id: 'perms', g: 'Security', t: 'Permissions',
